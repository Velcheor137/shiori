name: Release

# Релиз по тегу vX.Y.Z / vX.Y.Z-(alpha|beta|rc).N на main (§13.5 плана).
# Нужны секреты окружения «release»: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; переменная репозитория EXPECTED_CERT_SHA256 (рекомендуется).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег, например v0.4.0-rc.1'
        required: true
      dry_run:
        description: 'Только собрать и проверить, не публиковать'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - id: v
        name: Parse and validate tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$ ]]; then
            echo "::error::Неверный тег $TAG"; exit 1
          fi
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::Тег $TAG не на ветке main"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Tests
        run: ./gradlew --no-daemon test testDebugUnitTest -PreleaseVersion=${{ steps.v.outputs.version }}

  build-signed:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 в окружении release (см. README / DEVELOPMENT_PLAN §13.7)"; exit 1
          fi
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          SHIORI_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SHIORI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHIORI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SHIORI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PreleaseVersion=${{ needs.verify.outputs.version }}
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify signature, certificate and version
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Нет подписанного APK"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee signer.txt
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            EXP=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
            grep -qi "SHA-256 digest: $EXP" signer.txt || { echo "::error::Сертификат подписи не совпадает с EXPECTED_CERT_SHA256"; exit 1; }
          else
            echo "::warning::Переменная EXPECTED_CERT_SHA256 не задана — сертификат не сверяется"
          fi
          "$BT/aapt2" dump badging "$APK" | tee badging.txt
          grep -q "package: name='io.github.velcheor137.shiori'" badging.txt
          grep -q "versionName='${VERSION}'" badging.txt
          mkdir -p dist
          cp "$APK" "dist/shiori-${VERSION}.apk"
          (cd dist && sha256sum "shiori-${VERSION}.apk" > "shiori-${VERSION}.apk.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/*
          retention-days: 30

  publish:
    needs: [verify, build-signed]
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist
      - name: Release notes
        run: |
          V="${{ needs.verify.outputs.version }}"
          awk -v v="## [$V]" 'index($0,v)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 "v$V^" 2>/dev/null || true)
            echo "Изменения:" > notes.md
            git log --pretty='- %s' ${PREV:+$PREV..}"v$V" >> notes.md
          fi
          printf '\n---\nНеофициальный клиент RanobeLib. Проверка файла: `sha256sum -c shiori-%s.apk.sha256`\n' "$V" >> notes.md
      - name: Create release (no overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Релиз $TAG уже существует — не перезаписываю"; exit 1
          fi
          PRE=""
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then PRE="--prerelease"; fi
          gh release create "$TAG" dist/* --title "Shiori $TAG" --notes-file notes.md --verify-tag $PRE
